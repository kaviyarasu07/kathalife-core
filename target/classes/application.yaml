spring:
  application:
    name: kathalife-core
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  ai:
    anthropic:
      api-key: "dummy-not-used-yet"

  datasource:
    url: jdbc:postgresql://localhost:5432/kathalife_db
    username: kathalife
    password: kathalife
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  spring:
    flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: false
      validate-on-migrate: true
      clean-disabled: true
  security:
    user:
      name: disable

server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /api

application:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 900000        # 15 minutes
    refresh-expiration-ms: 604800000  # 7 days

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.kathalife: DEBUG
    org.springframework.security: WARN
    org.hibernate: WARN

sarvam:
      api:
        key: ${SARVAM_API_KEY}
        base-url: https://api.sarvam.ai
      stt:
        endpoint: /speech-to-text
        model: saaras:v3
